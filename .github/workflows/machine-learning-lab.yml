name: Machine learning lab
on:
  pull_request:
    paths:
      - 'labs/Hemi.MachineLearning/**'
      - '.github/workflows/machine-learning-lab.yml'
  push:
    branches: [master]
    paths:
      - 'labs/Hemi.MachineLearning/**'
      - '.github/workflows/machine-learning-lab.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r labs/Hemi.MachineLearning/requirements.txt
      - run: python -m unittest discover -s labs/Hemi.MachineLearning -v
      - run: python labs/Hemi.MachineLearning/lab.py
