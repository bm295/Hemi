name: Pull request validation

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore Hemi.sln

      - name: Build
        run: dotnet build Hemi.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Hemi.sln --configuration Release --no-build --no-restore
